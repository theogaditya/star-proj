---
# HPA configured to scale on active_connections_per_pod custom metric
# Same target density as StatefulAutoscaler: 100 connections per pod
# Same min/max replicas as Experiment C for fair comparison
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: websocket-hpa-custom-metric
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: websocket-server
  minReplicas: 2
  maxReplicas: 15
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120  # Same as StatefulAutoscaler scaleDownCooldownSeconds
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 3
          periodSeconds: 15
  metrics:
    - type: Pods
      pods:
        metric:
          name: active_connections_per_pod
        target:
          type: AverageValue
          averageValue: "100"
