---
# mqtt_experiment_b.yml — Experiment B: StatefulAutoscaler — 3 Failures Solved
#
# Directly mirrors Exp A's 3 phases — each phase proves one HPA failure is fixed:
#
#   Phase 1 (FIX ❶): 1000 clients → StatefulAutoscaler scales to ~7 pods → 0 refused
#   Phase 2 (FIX ❷): Steady state → per-pod connections balanced at ~142 each
#   Phase 3 (FIX ❸): Kill loadgen → graceful drain → replicas step down smoothly
#
# Usage:
#   ansible-playbook scripts/ansi/mqtt_experiment_b.yml
#
- name: "Experiment-B MQTT: StatefulAutoscaler — 3 Failures Solved"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir }}/../.."
    cluster_name: mqtt-exp-b
    result_dir: "{{ project_root }}/results/raw/mqtt/experiment-b-stateful"
    # Phase 1: same load as Exp A to prove 0 clients refused
    phase1_clients: 1000
    phase1_ramp_seconds: 60
    phase1_duration: 300
    # Phase 2: steady state observation
    phase2_duration: 180
    # Phase 3: graceful drain observation
    phase3_duration: 300
    # Shared
    ping_interval: 30

  tasks:
    # ── Stage 0: Archive previous results ────────────────────────
    - name: "Stage 0 — check for previous results"
      ansible.builtin.find:
        paths: "{{ result_dir }}"
        file_type: file
      register: prev_results
      ignore_errors: true

    - name: "Stage 0 — archive previous results"
      ansible.builtin.shell: |
        mkdir -p {{ project_root }}/results/tar
        tar -czf {{ project_root }}/results/tar/experiment-b-mqtt_$(date +%Y%m%d_%H%M%S).tgz -C {{ result_dir }} .
        rm -rf {{ result_dir }}
      when: prev_results.matched | default(0) > 0

    - name: "Stage 0 — create result directory"
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0755"

    # ── Stage 1+2: Infrastructure + Images ───────────────────────
    - name: "Stage 1+2 — setup infrastructure and images"
      ansible.builtin.import_tasks: mqtt_common.yml

    # ── Stage 2b: Build & load StatefulAutoscaler controller ─────
    - name: "Stage 2b — build StatefulAutoscaler controller image"
      ansible.builtin.shell: |
        cd {{ project_root }}/controller
        IMG=star-controller:latest make docker-build IMG=star-controller:latest 2>&1 | tail -5

    - name: "Stage 2b — save + load controller image into Kind"
      ansible.builtin.shell: |
        TMPDIR=$(mktemp -d)
        docker save star-controller:latest -o $TMPDIR/star-controller.tar
        kind load image-archive $TMPDIR/star-controller.tar --name {{ cluster_name }}
        rm -rf $TMPDIR

    # ── Stage 3: Deploy workloads ────────────────────────────────
    - name: "Stage 3 — deploy StatefulAutoscaler controller"
      ansible.builtin.shell: |
        cd {{ project_root }}/controller
        IMG=star-controller:latest make deploy IMG=star-controller:latest

    - name: "Stage 3 — wait for StatefulAutoscaler controller rollout"
      ansible.builtin.command: >
        kubectl -n controller-system rollout status
        deployment/controller-controller-manager --timeout=300s

    - name: "Stage 3 — deploy broker + StatefulAutoscaler CR"
      ansible.builtin.shell: |
        kubectl apply -f {{ project_root }}/workloads/mqtt/k8s/deployment.yml
        kubectl apply -f {{ project_root }}/workloads/mqtt/k8s/service.yml
        kubectl apply -f {{ project_root }}/experiments/mqtt/experiment-b-stateful/statefulautoscaler.yaml

    - name: "Stage 3 — wait for broker readiness"
      ansible.builtin.command: >
        kubectl wait --for=condition=ready pod -l app=mqtt-broker --timeout=300s

    # ── Stage 3b: Verify Prometheus scrape ───────────────────────
    - name: "Stage 3b — start Prometheus port-forward"
      ansible.builtin.shell: |
        nohup kubectl port-forward svc/prometheus -n monitoring 9090:9090 \
          >/tmp/pf-prometheus.log 2>&1 &
        echo $!
      register: pf_result

    - name: "Stage 3b — wait for port-forward to bind"
      ansible.builtin.pause:
        seconds: 4

    - name: "Stage 3b — verify port-forward is listening"
      ansible.builtin.shell: |
        curl -sf --max-time 3 "http://localhost:9090/api/v1/query?query=up" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok' if d.get('status')=='success' else 'fail')" 2>/dev/null || echo fail
      register: pf_check
      until: "pf_check.stdout == 'ok'"
      retries: 15
      delay: 2
      ignore_errors: true

    - name: "Stage 3b — wait for Prometheus to scrape active_connections"
      ansible.builtin.shell: |
        curl -sf "http://localhost:9090/api/v1/query?query=active_connections" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); r=d['data']['result']; print(len(r))" 2>/dev/null || echo 0
      register: prom_scrape
      until: "prom_scrape.stdout | int > 0"
      retries: 24
      delay: 5
      ignore_errors: true

    # ── Stage 4: Start all collectors ────────────────────────────
    - name: "Stage 4 — start pod collector"
      ansible.builtin.shell: |
        nohup bash -c 'while true; do echo "$(date +%s)" >> {{ result_dir }}/pods.log; kubectl get pods -l app=mqtt-broker --no-headers >> {{ result_dir }}/pods.log 2>/dev/null || true; sleep 5; done' &>/dev/null &
        echo $!
      register: pods_pid

    - name: "Stage 4 — start StatefulAutoscaler status collector"
      ansible.builtin.shell: |
        nohup bash -c 'while true; do echo "$(date +%s)" >> {{ result_dir }}/autoscaler.log; kubectl get statefulautoscaler mqtt-autoscaler -o wide --no-headers >> {{ result_dir }}/autoscaler.log 2>/dev/null || true; sleep 5; done' &>/dev/null &
        echo $!
      register: sa_pid

    - name: "Stage 4 — start CPU collector"
      ansible.builtin.shell: |
        nohup bash -c 'while true; do echo "$(date +%s)" >> {{ result_dir }}/cpu.log; kubectl top pods -l app=mqtt-broker --no-headers 2>/dev/null >> {{ result_dir }}/cpu.log || true; sleep 5; done' &>/dev/null &
        echo $!
      register: cpu_pid

    - name: "Stage 4 — start memory collector"
      ansible.builtin.shell: |
        nohup bash -c 'while true; do echo "$(date +%s)" >> {{ result_dir }}/memory.log; kubectl top pods -l app=mqtt-broker --no-headers 2>/dev/null | awk "{gsub(/Mi/,\"\",$3); total+=$3} END{print (total?total:0)}" >> {{ result_dir }}/memory.log || echo "0" >> {{ result_dir }}/memory.log; sleep 5; done' &>/dev/null &
        echo $!
      register: mem_pid

    - name: "Stage 4 — start connection collector"
      ansible.builtin.shell: |
        nohup bash -c 'while true; do echo "$(date +%s)" >> {{ result_dir }}/active_connections.log; curl -s "http://localhost:9090/api/v1/query?query=sum(active_connections)" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d[\"data\"][\"result\"]; print(r[0][\"value\"][1] if r else \"0\")" >> {{ result_dir }}/active_connections.log 2>/dev/null || echo "0" >> {{ result_dir }}/active_connections.log; sleep 5; done' &>/dev/null &
        echo $!
      register: conn_pid

    - name: "Stage 4 — start per-pod connection collector"
      ansible.builtin.shell: |
        nohup bash -c 'while true; do echo "$(date +%s)" >> {{ result_dir }}/perpod_connections.log; curl -s "http://localhost:9090/api/v1/query?query=active_connections" | python3 -c "import sys,json; d=json.load(sys.stdin); out={}; [out.update({((r.get(\"metric\",{}).get(\"pod\") or r.get(\"metric\",{}).get(\"kubernetes_pod_name\") or r.get(\"metric\",{}).get(\"instance\") or \"unknown\")): int(float(r[\"value\"][1]))}) for r in d.get(\"data\",{}).get(\"result\",[])]; print(json.dumps(out))" >> {{ result_dir }}/perpod_connections.log 2>/dev/null || echo "{}" >> {{ result_dir }}/perpod_connections.log; sleep 5; done' &>/dev/null &
        echo $!
      register: perpod_pid

    # ═══════════════════════════════════════════════════════════════
    # PHASE 1: FIX ❶ — Scale-up Blindness
    # StatefulAutoscaler watches active_connections, not CPU
    # 1000 clients → scales to ~7 pods → 0 refused (vs 661 in Exp A)
    # ═══════════════════════════════════════════════════════════════
    - name: "▶ PHASE 1: Fix Scale-up Blindness — ramp {{ phase1_clients }} clients"
      ansible.builtin.shell: |
        echo "PHASE1_START $(date +%s)" >> {{ result_dir }}/phases.log
        kubectl run mqtt-loadgen \
          --image=mqtt-loadgen:latest --restart=Never --image-pull-policy=Never \
          --env="BROKER_HOST=mqtt-service" --env="CLIENTS={{ phase1_clients }}" \
          --env="RAMP_SECONDS={{ phase1_ramp_seconds }}" --env="PING_INTERVAL={{ ping_interval }}"

    - name: "Phase 1 — wait {{ phase1_duration }}s (observe scale-up)"
      ansible.builtin.pause:
        seconds: "{{ phase1_duration }}"

    - name: "Phase 1 — collect logs"
      ansible.builtin.shell: |
        kubectl logs mqtt-loadgen >> {{ result_dir }}/loadgen-phase1.log 2>/dev/null || true
        echo "PHASE1_END $(date +%s)" >> {{ result_dir }}/phases.log

    # ═══════════════════════════════════════════════════════════════
    # PHASE 2: FIX ❷ — Even Distribution (no pinned overload)
    # Same clients still running — observe per-pod balance
    # Each pod ~142 connections (target: 150), no overloaded pod
    # ═══════════════════════════════════════════════════════════════
    - name: "▶ PHASE 2: Fix Redistribution — observe even per-pod balance"
      ansible.builtin.shell: |
        echo "PHASE2_START $(date +%s)" >> {{ result_dir }}/phases.log
        kubectl get pods -l app=mqtt-broker --no-headers >> {{ result_dir }}/phase2_pod_snapshot.log

    - name: "Phase 2 — wait {{ phase2_duration }}s (steady state observation)"
      ansible.builtin.pause:
        seconds: "{{ phase2_duration }}"

    - name: "Phase 2 — collect logs"
      ansible.builtin.shell: |
        kubectl logs mqtt-loadgen >> {{ result_dir }}/loadgen-phase2.log 2>/dev/null || true
        echo "PHASE2_END $(date +%s)" >> {{ result_dir }}/phases.log

    # ═══════════════════════════════════════════════════════════════
    # PHASE 3: FIX ❸ — Graceful Drain (no violent disconnection)
    # Kill loadgen → connections drop → StatefulAutoscaler drains
    # Replicas step down one at a time, /drain called before kill
    # No sudden spike of 300+ clients dropping simultaneously
    # ═══════════════════════════════════════════════════════════════
    - name: "▶ PHASE 3: Fix Violent Disconnection — kill loadgen, watch graceful drain"
      ansible.builtin.shell: |
        echo "PHASE3_START $(date +%s)" >> {{ result_dir }}/phases.log
        kubectl delete pod mqtt-loadgen --ignore-not-found

    - name: "Phase 3 — wait {{ phase3_duration }}s (observe graceful scale-down)"
      ansible.builtin.pause:
        seconds: "{{ phase3_duration }}"

    - name: "Phase 3 — mark end"
      ansible.builtin.shell: |
        echo "PHASE3_END $(date +%s)" >> {{ result_dir }}/phases.log

    # ── Stage 5: Cleanup ─────────────────────────────────────────
    - name: "Stage 5 — kill background collectors"
      ansible.builtin.shell: |
        kill {{ pods_pid.stdout }} {{ sa_pid.stdout }} {{ cpu_pid.stdout }} {{ mem_pid.stdout }} {{ conn_pid.stdout }} {{ perpod_pid.stdout }} {{ pf_result.stdout }} 2>/dev/null || true
      ignore_errors: true

    - name: "Stage 5 — delete Kind cluster"
      ansible.builtin.command: "kind delete cluster --name {{ cluster_name }}"
      ignore_errors: true

    - name: "Stage 5 — result summary"
      ansible.builtin.shell: "wc -l {{ result_dir }}/*.log 2>/dev/null || true"
      register: summary

    - name: "Result summary"
      ansible.builtin.debug:
        msg: "{{ summary.stdout_lines }}"

    - name: "✓ Experiment-B MQTT complete — all 3 HPA failures solved"
      ansible.builtin.debug:
        msg: "Results in {{ result_dir }}"
